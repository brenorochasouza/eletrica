<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Quadro de cargas, dimensionamento e memorial de cálculo pela NBR 5410 e DIS-NOR-030">
<meta name="apple-mobile-web-app-title" content="Quadro de Cargas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Quadro de cargas | Souza Engenharia</title>
<style>
:root{
  --brand:#C43E50;--brand-d:#9E2F3F;--brand-l:#FBEEF0;
  --ink:#1F2328;--ink2:#57606A;--ink3:#8C959F;
  --line:#E4E7EB;--line2:#CFD4DA;--bg:#F5F6F8;--card:#fff;
  --ok:#1A7F37;--okbg:#E7F4EA;--bad:#B42318;--badbg:#FDECEC;--amb:#946200;--ambbg:#FFF4D6;
  --pR:#C43E50;--pS:#2E6DB4;--pT:#2F8A57;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.45;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
h1{font-size:22px}h2{font-size:16px}h3{font-size:15px}
button{font:inherit}
.muted{color:var(--ink2)}
.small{font-size:12px}
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.top-in{max-width:1600px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.15;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.brand b{color:var(--brand);letter-spacing:.09em;font-size:13px;font-weight:750}
.brand span{font-size:12px;color:var(--ink2)}
.top-mid{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 200px}
.top-mid .sep{width:1px;height:28px;background:var(--line)}
.top-title{font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-act{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line2);background:#fff;color:var(--ink);border-radius:8px;font-size:13px;font-weight:550;cursor:pointer;white-space:nowrap}
.btn:hover{background:#F2F3F5}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-d)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:#EEF0F3}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border:0;background:transparent;border-radius:6px;color:var(--ink3);cursor:pointer}
.icon-btn:hover{background:#EEF0F3;color:var(--ink)}
.icon-btn.del:hover{color:var(--bad);background:var(--badbg)}
.wrap{max-width:1600px;margin:0 auto;padding:18px 16px 80px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.sec{margin-top:16px}
.warnbar{background:var(--ambbg);color:var(--amb);border:1px solid #F2D58A;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px}
/* home */
.home-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.home-head p{margin:4px 0 0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.scard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.scard:hover{border-color:var(--brand)}
.scard h3{font-size:16px}
.scard .meta{font-size:12.5px;color:var(--ink2)}
.scard .kpis{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px}
.scard .kpis b{font-size:15px;display:block;color:var(--ink)}
.scard .row{display:flex;gap:6px;margin-top:4px}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--brand-l);color:var(--brand-d)}
.empty{text-align:center;padding:48px 16px}
/* forms */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 12px}
.fgrid .wide{grid-column:span 2}
.fl{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2);font-weight:550;min-width:0}
.fi,.fs,.fta{height:36px;border:1px solid var(--line2);border-radius:8px;padding:0 10px;font:inherit;font-size:14px;color:var(--ink);background:#fff;width:100%;min-width:0}
.fta{height:60px;padding:8px 10px;resize:vertical}
.fi:focus,.fs:focus,.fta:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-l)}
details.card>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary .chev{transition:transform .15s}
details[open].card>summary .chev{transform:rotate(180deg)}
details.card>summary+*{margin-top:14px}
.sumline{font-size:12.5px;color:var(--ink2);font-weight:400;margin-left:8px}
/* overview */
.ov{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#F7F8FA;border-radius:10px;padding:10px 12px}
.kpi span{display:block;font-size:12px;color:var(--ink2)}
.kpi b{display:block;font-size:19px;font-weight:650;font-variant-numeric:tabular-nums}
.kpi small{font-size:11.5px;color:var(--ink2)}
.ent-in{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.hint{font-size:12px;color:var(--ink3);margin:8px 0 0}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{margin-left:14px;padding-left:16px;border-left:1.5px solid var(--line2)}
.tree li{position:relative;margin:8px 0 0}
.tree ul>li::before{content:"";position:absolute;left:-16px;top:20px;width:14px;border-top:1.5px solid var(--line2)}
.tn{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--ink)}
.tn:hover{border-color:var(--brand)}
.tn b{font-size:14px}
.tn .d{color:var(--ink2);font-size:12px;margin-left:6px}
.tn .m{display:block;font-size:12px;color:var(--ink2);margin-top:2px}
.tn .f{display:block;font-size:12px;color:var(--brand-d);margin-top:1px}
.tn.medidor{border-color:#E9C3CA;background:#FFFBFC}
/* quadro */
.quadro{background:#fff;border:1px solid var(--line);border-radius:12px;margin-top:16px;overflow:hidden;scroll-margin-top:calc(var(--toph,58px) + 70px)}
.q-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px;background:#FCFCFD}
.q-row1{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.q-name{font-size:17px;font-weight:700;width:110px;height:36px;border:1px solid transparent;border-radius:8px;padding:0 8px;color:var(--brand-d);background:transparent}
.q-desc{flex:1 1 220px;height:36px;border:1px solid transparent;border-radius:8px;padding:0 8px;font:inherit;font-size:14px;color:var(--ink);background:transparent;min-width:0}
.q-name:hover,.q-desc:hover{border-color:var(--line2)}
.q-name:focus,.q-desc:focus{outline:none;border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px var(--brand-l)}
.q-acts{display:flex;gap:6px;flex-wrap:wrap}
.q-fields{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:flex-end}
.q-fields .fl{width:auto}
.q-fields .fi,.q-fields .fs{height:32px;font-size:13px}
.q-feed{font-size:12.5px;color:var(--ink2)}
.q-feed b{color:var(--ink)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;padding:2px 7px;border-radius:6px;background:#EEF0F3;color:var(--ink2)}
.tag.med{background:var(--brand-l);color:var(--brand-d)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.ct{border-collapse:separate;border-spacing:0;width:100%;min-width:1180px;font-size:13px}
.ct th{background:#fff;color:var(--ink2);font-weight:600;font-size:11.5px;text-align:left;padding:9px 6px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
.ct th.n{text-align:right;padding-right:8px}
.ct td{padding:3px 4px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle;background:#fff}
.ct td.n{text-align:right;font-variant-numeric:tabular-nums;padding-right:8px;color:var(--ink)}
.ct .sticky{position:sticky;left:0;z-index:1}
.ct tr.feed td{background:#FDF6F7}
.ct tfoot td{font-weight:650;background:#FAFAFB;border-bottom:0;padding-top:8px;padding-bottom:8px}
.in{height:30px;border:1px solid transparent;border-radius:6px;padding:0 6px;font:inherit;font-size:13px;background:transparent;color:var(--ink);width:100%}
.in:hover{border-color:var(--line2)}
.in:focus{outline:none;border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px var(--brand-l)}
.in.num{text-align:right}
.in::placeholder{color:#9AA3AD}
.in.code{width:52px;font-weight:600}
.in.desc{min-width:130px}
.in.w{width:66px}.in.fp{width:46px}.in.cm{width:60px}.in.dj{width:58px}.in.cb{width:58px}
.sel{height:30px;border:1px solid var(--line2);border-radius:6px;background:#fff;font:inherit;font-size:13px;padding:0 4px;color:var(--ink)}
.fz-wrap{display:flex;align-items:center;gap:2px}
.lock{width:26px;height:26px;border:0;background:transparent;border-radius:6px;color:#C3C9D0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.lock:hover{background:#EEF0F3}
.lock.on{color:var(--brand)}
.lock svg{width:14px;height:14px}
.link{background:none;border:0;padding:0 6px;color:var(--brand-d);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.st{width:34px;text-align:center}
.st .ok{color:var(--ok)}.st .bad{color:var(--bad)}
.q-foot{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;padding:14px 16px;border-top:1px solid var(--line)}
.q-foot-l{display:flex;flex-direction:column;gap:8px}
.q-tot{font-size:12.5px;color:var(--ink2)}
.q-tot b{color:var(--ink)}
.phs-box{display:flex;flex-direction:column;gap:8px;min-width:min(100%,360px)}
.phs{display:grid;gap:6px}
.ph{display:grid;grid-template-columns:22px minmax(60px,1fr) 92px 62px;align-items:center;gap:8px;font-size:12.5px;font-variant-numeric:tabular-nums}
.ph-l{font-weight:700;text-align:center;border-radius:5px;color:#fff;font-size:11px;line-height:20px}
.ph-bar{height:8px;background:#EEF0F3;border-radius:4px;overflow:hidden}
.ph-bar i{display:block;height:100%;border-radius:4px}
.ph .v,.ph .a{text-align:right}
.bR{background:var(--pR)}.bS{background:var(--pS)}.bT{background:var(--pT)}
.deseq{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px}
.deseq b.ok{color:var(--ok)}.deseq b.mid{color:var(--amb)}.deseq b.bad{color:var(--bad)}
.alerts{padding:0 16px 14px;display:flex;flex-direction:column;gap:4px}
.alerts:empty{display:none}
.al{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;color:var(--bad)}
.al svg{width:14px;height:14px;margin-top:2px}
.al.ent{padding:0}
.addq{display:flex;justify-content:center;margin-top:16px}
.foot-notes{font-size:12px;color:var(--ink3);margin-top:18px;line-height:1.55}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1F2328;color:#fff;padding:10px 14px;border-radius:10px;display:flex;gap:14px;align-items:center;font-size:13px;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:#FFB7C1;font-weight:700;cursor:pointer;padding:0}
@media (max-width:860px){
  .ov{grid-template-columns:1fr}
  .fgrid .wide{grid-column:span 1}
  .top-act .lbl{display:none}
  .top-act .btn{padding:0 9px}
  h1{font-size:20px}
  .top-in.ed{flex-wrap:nowrap;gap:6px;padding:8px 10px}
  .top-in.ed .brand,.top-in.ed .sep{display:none}
  .top-in.ed .top-mid{flex:1 1 0;gap:2px}
  .top-in.ed .top-act{flex-wrap:nowrap;gap:4px}
  .top-in.ed .top-act .btn{width:34px;padding:0}
  .wrap{padding:12px 10px 80px}
  .q-head,.q-foot{padding:12px}
  .alerts{padding:0 12px 12px}
}
.seg .sh{display:none}
.hide-sm{}
@media (min-width:761px){.ct th{white-space:normal;vertical-align:bottom;line-height:1.25}.ct .drc .sel{width:80px}.ct td:nth-child(4) .drlbl{min-width:12px}.in.qt{width:40px}}
button,select,input,a{touch-action:manipulation}
@media (display-mode:standalone){.top{padding-top:env(safe-area-inset-top)}.toast{bottom:calc(20px + env(safe-area-inset-bottom))}}
@media (max-width:760px){
  .seg .lg{display:none}.seg .sh{display:inline}
  .seg button{padding:7px 10px;font-size:12.5px}
  .hide-sm{display:none!important}
  .q-foot{flex-direction:column}
  .phs-box{min-width:0;width:100%}
  .ptab{font-size:12.5px}
  .evb table.ptab{min-width:0;font-size:12px}
  .evb table.ptab th,.evb table.ptab td{padding:6px 4px;white-space:normal}
  .evb table.ptab td.n{white-space:nowrap}
  .evb table.ptab tfoot td,.evb table.ptab tfoot td.n{white-space:normal}
  .evb table.tdem tbody td:nth-child(4),.evb table.tdem thead th:nth-child(4),.evb table.tdem tbody td:nth-child(6),.evb table.tdem thead th:nth-child(6),.evb table.tdem tbody td:nth-child(7),.evb table.tdem thead th:nth-child(7){display:none}
  .fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fgrid .wide{grid-column:1/-1}
  .ptab.mat{min-width:0!important;display:block}
  .ptab.mat thead{display:none}.ptab.mat tbody{display:block}
  .ptab.mat tr{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:2px 6px;padding:9px 2px;border-bottom:1px solid var(--line)}
  .ptab.mat td{border:0;padding:0;display:block}
  .ptab.mat td:empty{display:none}
  .ptab.mat td:nth-child(1){font-weight:650;color:var(--ink)}
  .ptab.mat td:nth-child(2){grid-column:1/-1;grid-row:2;color:var(--ink2);font-size:12.5px}
  .ptab.mat td:nth-child(3){grid-column:2;grid-row:1;font-weight:700}
  .ptab.mat td:nth-child(4){grid-column:3;grid-row:1;color:var(--ink2)}
  .ptab.mat td:nth-child(5){grid-column:1/-1;grid-row:3;font-size:12px;color:var(--ink3)}
  .ptab.mat tr.mat-g{display:block;padding:16px 2px 6px;border-bottom:2px solid var(--brand-l)}
  .ptab.mat tr.mat-g td{background:transparent;padding:0}
  .q-fields .fl{flex:1 1 140px}
  .modal{padding:16px}
}
.segbar{position:sticky;top:var(--toph,58px);z-index:20;background:var(--bg);padding:12px 0 4px;margin-top:8px}
.seg{display:flex;gap:4px;background:#E9EBEE;border-radius:10px;padding:4px;width:max-content;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;color:var(--brand-d);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.drc{display:flex;align-items:center;gap:4px}
.drc .sel{width:104px}
.drlbl{font-size:11.5px;font-weight:700;color:var(--brand-d);min-width:32px}
.drlbl.no{color:var(--ink3);font-weight:500}
.pv-h{font-size:17px;flex:1 1 auto}
.pv-h .pv-n{color:var(--brand-d);font-weight:700;margin-right:6px}
.pv-h .pv-d{color:var(--ink2);font-weight:400;font-size:14px}
.dtag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--brand-l);color:var(--brand-d);white-space:nowrap}
table.ptab{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
.ptab th{text-align:left;font-size:11.5px;color:var(--ink2);font-weight:600;padding:9px 10px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
.ptab td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.ptab td.n,.ptab th.n{text-align:right;font-variant-numeric:tabular-nums}
.ptab tfoot td{font-weight:650;background:#FAFAFB;border-bottom:0}
.codes{display:flex;flex-wrap:wrap;gap:4px}
.code-l{background:#F1F2F4;border:0;border-radius:5px;padding:2px 7px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink)}
.code-l:hover{background:var(--brand-l);color:var(--brand-d)}
.svgbox{overflow-x:auto;-webkit-overflow-scrolling:touch;background:#fff;padding:8px 0}
svg.dg{fill:#1F2328;stroke:none;stroke-width:1;flex:none;display:block;margin:0 auto}
svg.dg .svgcol{cursor:pointer}
svg.dg .svgcol:hover .brk,svg.dg .svgcol:hover .nd{fill:#FBEEF0}
tr.flash td{animation:flash 1.8s ease}
@keyframes flash{0%,35%{background:#FFF0B3}100%{background:#fff}}
.syncb .dot{width:9px;height:9px;border-radius:50%;background:#B8BEC6;flex:none}
.syncb[data-st="ok"] .dot{background:var(--ok)}
.syncb[data-st="pend"] .dot,.syncb[data-st="busy"] .dot{background:#D99A00}
.syncb[data-st="erro"] .dot{background:var(--bad)}
.syncb[data-st="offline"] .dot{background:#6E7781}
.syncb[data-st="busy"] .dot{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.modal-bg{position:fixed;inset:0;background:rgba(15,18,22,.45);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:6vh 12px;overflow:auto}
.modal{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.modal ol{padding-left:20px;margin:10px 0;font-size:13px;line-height:1.6;color:var(--ink2)}
.sync-st{font-size:13px;margin-top:10px;color:var(--ink2);background:#F7F8FA;border-radius:8px;padding:8px 10px}
.sync-st .bad{color:var(--bad);font-weight:600}.sync-st .ok{color:var(--ok);font-weight:600}
.cwrap{display:flex;align-items:center}
.grip{width:22px;height:30px;border:0;background:transparent;color:#B3BAC2;cursor:grab;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;touch-action:none;padding:0;flex:none}
.grip:hover,.grip:focus-visible{color:var(--ink2);background:#EEF0F3;outline:none}
.grip svg{width:14px;height:14px}
tr.drag-row td{background:#FFF4D1!important}
tr.drag-row .grip{color:var(--brand)}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none!important;-webkit-user-select:none!important}
tbody.drop-target td{background:#FDF6F7}
/* entrada e memorial */
.fsep{grid-column:1/-1;font-size:11.5px;font-weight:700;color:var(--brand-d);text-transform:uppercase;letter-spacing:.06em;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.ent-spec{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:0 0 12px;font-size:12.5px}
.ent-spec span{display:block;color:var(--ink2);font-size:11.5px}
.ent-spec b{font-weight:600}
.ent-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

const GAS_CODE="/**\n * Quadro de Cargas · Souza Engenharia\n * Sincronização dos serviços com uma Planilha Google.\n *\n * Como usar:\n * 1. Cole este código num projeto do Apps Script: pela planilha (Extensões > Apps Script)\n *    ou direto em script.google.com. Se o projeto não estiver ligado a uma planilha,\n *    o script cria sozinho a planilha \"Quadro de Cargas · Dados\" no seu Drive.\n * 2. Rode a função configurar uma vez (botão Executar) para autorizar e ver o link da planilha.\n * 3. Troque a CHAVE abaixo por uma senha só sua e salve.\n * 4. Implantar > Nova implantação > App da Web.\n *    Executar como: Eu. Quem pode acessar: Qualquer pessoa. Implantar e autorizar.\n * 5. Copie o URL do app da Web (termina em /exec) e cole no programa,\n *    no botão de sincronização, junto com a mesma CHAVE.\n *\n * Ao alterar este código depois: Implantar > Gerenciar implantações > Editar >\n * Versão: Nova versão. Assim o URL continua o mesmo.\n */\nconst CHAVE = 'TROQUE-ESTA-CHAVE';\nconst ABA = 'servicos';\nconst PEDACO = 40000; // caracteres por célula (limite da planilha: 50.000)\n\nfunction doGet(e) {\n  return trata_((e && e.parameter) || {});\n}\n\nfunction doPost(e) {\n  let p = {};\n  try {\n    p = JSON.parse((e && e.postData && e.postData.contents) || '{}');\n  } catch (err) {\n    return json_({ ok: false, erro: 'Pedido inválido' });\n  }\n  return trata_(p);\n}\n\nfunction trata_(p) {\n  if (!p || p.token !== CHAVE) return json_({ ok: false, erro: 'Chave inválida' });\n  const lock = LockService.getScriptLock();\n  lock.waitLock(20000);\n  try {\n    const sh = aba_();\n    switch (p.acao) {\n      case 'ping':\n        return json_({ ok: true, agora: Date.now(), total: lerTodos_(sh).filter(function (s) { return !s.excluido; }).length });\n      case 'tudo':\n        return json_({ ok: true, agora: Date.now(), servicos: lerTodos_(sh) });\n      case 'salvar':\n        return json_(Object.assign({ ok: true }, salvar_(sh, p.servico)));\n      case 'excluir':\n        return json_(Object.assign({ ok: true }, excluir_(sh, p.id, p.em)));\n      default:\n        return json_({ ok: false, erro: 'Ação desconhecida' });\n    }\n  } catch (err) {\n    return json_({ ok: false, erro: String(err && err.message ? err.message : err) });\n  } finally {\n    lock.releaseLock();\n  }\n}\n\nfunction configurar() {\n  const ss = planilha_();\n  aba_();\n  Logger.log('Planilha de dados: ' + ss.getUrl());\n}\n\nfunction planilha_() {\n  const ativa = SpreadsheetApp.getActive();\n  if (ativa) return ativa;\n  const props = PropertiesService.getScriptProperties();\n  const id = props.getProperty('PLANILHA_ID');\n  if (id) {\n    try { return SpreadsheetApp.openById(id); } catch (err) { /* planilha apagada: cria outra */ }\n  }\n  const nova = SpreadsheetApp.create('Quadro de Cargas · Dados');\n  props.setProperty('PLANILHA_ID', nova.getId());\n  return nova;\n}\n\nfunction aba_() {\n  const ss = planilha_();\n  let sh = ss.getSheetByName(ABA);\n  if (!sh) {\n    sh = ss.insertSheet(ABA);\n    sh.getRange(1, 1, 1, 6).setValues([['id', 'nome', 'cliente', 'atualizado', 'excluido', 'dados']]);\n    sh.setFrozenRows(1);\n    sh.getRange('A:C').setNumberFormat('@');\n  }\n  return sh;\n}\n\nfunction linhas_(sh) {\n  const n = sh.getLastRow();\n  if (n < 2) return [];\n  return sh.getRange(2, 1, n - 1, Math.max(sh.getLastColumn(), 6)).getValues();\n}\n\nfunction lerTodos_(sh) {\n  return linhas_(sh).filter(function (r) { return r[0] !== ''; }).map(function (r) {\n    const excluido = r[4] === true || String(r[4]).toUpperCase() === 'TRUE';\n    let dados = null;\n    if (!excluido) {\n      const txt = r.slice(5).filter(function (c) { return c !== ''; }).map(function (c) { return String(c).slice(1); }).join('');\n      try { dados = txt ? JSON.parse(txt) : null; } catch (err) { dados = null; }\n    }\n    return { id: String(r[0]), atualizado: Number(r[3]) || 0, excluido: excluido, dados: dados };\n  });\n}\n\nfunction acha_(sh, id) {\n  const ids = linhas_(sh).map(function (r) { return String(r[0]); });\n  const i = ids.indexOf(String(id));\n  return i < 0 ? -1 : i + 2;\n}\n\nfunction salvar_(sh, s) {\n  if (!s || !s.id) throw new Error('Serviço inválido');\n  let row = acha_(sh, s.id);\n  const novo = Number(s.atualizado) || Date.now();\n  if (row > 0) {\n    const atual = Number(sh.getRange(row, 4).getValue()) || 0;\n    if (atual > novo) return { aplicado: false, atualizado: atual };\n  }\n  const txt = JSON.stringify(s);\n  const partes = [];\n  for (let i = 0; i < txt.length; i += PEDACO) partes.push('J' + txt.slice(i, i + PEDACO));\n  const linha = [String(s.id), String(s.nome || ''), String(s.cliente || ''), novo, false].concat(partes);\n  if (row < 0) row = sh.getLastRow() + 1;\n  else sh.getRange(row, 1, 1, Math.max(sh.getLastColumn(), 6)).clearContent();\n  const faixa = sh.getRange(row, 1, 1, linha.length);\n  faixa.setNumberFormat('@');\n  sh.getRange(row, 4).setNumberFormat('0');\n  faixa.setValues([linha]);\n  return { aplicado: true, atualizado: novo };\n}\n\nfunction excluir_(sh, id, em) {\n  if (!id) throw new Error('Serviço inválido');\n  const quando = Number(em) || Date.now();\n  let row = acha_(sh, id);\n  if (row < 0) {\n    row = sh.getLastRow() + 1;\n    sh.getRange(row, 1).setNumberFormat('@');\n    sh.getRange(row, 1, 1, 5).setValues([[String(id), '', '', quando, true]]);\n    return { aplicado: true };\n  }\n  const atual = Number(sh.getRange(row, 4).getValue()) || 0;\n  if (atual > quando) return { aplicado: false, atualizado: atual };\n  sh.getRange(row, 4, 1, 2).setValues([[quando, true]]);\n  return { aplicado: true };\n}\n\nfunction json_(o) {\n  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);\n}\n";

const SYNC_PILL={off:'Sincronizar',ok:'Sincronizado',pend:'Salvando',busy:'Salvando',erro:'Erro ao salvar',offline:'Offline'};
function loadSync(){try{const t=localStorage.getItem(SYNC_KEY);if(t)SYNC=Object.assign({url:'',token:'',ultimo:0},JSON.parse(t))}catch(e){}}
function saveSync(){try{localStorage.setItem(SYNC_KEY,JSON.stringify(SYNC))}catch(e){}}
function pendencias(){return DB.servicos.some(s=>s.sincronizado!==s.atualizado)||(DB.excluidos||[]).some(t=>!t.ok)}
function limpo(s){const c=Object.assign({},s);delete c.sincronizado;return c}
function pillHTML(){return `<button class="btn sm syncb" data-act="syncpanel" data-sync data-st="${syncSt}" title="${esc(SYNC_TXT[syncSt]+(syncMsg?': '+syncMsg:''))}"><span class="dot"></span><span class="lbl">${SYNC_PILL[syncSt]}</span></button>`}
function syncStHTML(){
  if(!SYNC.url)return 'Sincronização desligada. Os serviços ficam salvos só neste aparelho.';
  const q=SYNC.ultimo?new Date(SYNC.ultimo).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'ainda não';
  const cl=syncSt==='erro'?'bad':syncSt==='ok'?'ok':'';
  return `<span class="${cl}">${esc(SYNC_TXT[syncSt])}</span>${syncMsg&&syncSt!=='ok'?' · '+esc(syncMsg):''}<br><span class="small">Última leitura da planilha: ${q}</span>`;
}
function setSync(st,msg){
  syncSt=st;syncMsg=msg||'';
  document.querySelectorAll('[data-sync]').forEach(el=>{el.dataset.st=st;el.title=SYNC_TXT[st]+(syncMsg?': '+syncMsg:'');const l=el.querySelector('.lbl');if(l)l.textContent=SYNC_PILL[st]});
  const m=document.querySelector('[data-syncst]');if(m)m.innerHTML=syncStHTML();
}
function agendarSync(ms){if(!SYNC.url)return;clearTimeout(syncT);if(syncSt!=='busy')setSync('pend');syncT=setTimeout(()=>sincronizar(false),ms==null?2500:ms)}
async function api(payload,cfg){
  const c=cfg||SYNC;const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),25000);
  try{
    let r;
    try{r=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({},payload,{token:c.token})),signal:ctl.signal,redirect:'follow'})}
    catch(e){if(navigator.onLine===false)throw Object.assign(new Error('sem internet'),{offline:true});throw new Error(e.name==='AbortError'?'o script demorou a responder':'não foi possível acessar o script; confira o URL e se o acesso está como "Qualquer pessoa"')}
    const txt=await r.text();let j;
    try{j=JSON.parse(txt)}catch(e){throw new Error('resposta inválida do script; confira o URL e se o acesso está como "Qualquer pessoa"')}
    if(!j.ok)throw new Error(j.erro||'falha no script');
    return j;
  }finally{clearTimeout(to)}
}
async function sincronizar(pull){
  if(!SYNC.url)return;
  if(syncBusy){syncAgain=true;return}
  clearTimeout(syncT);syncBusy=true;setSync('busy');
  try{
    for(const t of (DB.excluidos||[]).filter(t=>!t.ok)){await api({acao:'excluir',id:t.id,em:t.em});t.ok=true}
    if(pull){const j=await api({acao:'tudo'});mesclar(j.servicos||[]);SYNC.ultimo=Date.now();saveSync()}
    for(const sv of DB.servicos.filter(x=>x.sincronizado!==x.atualizado)){
      const at=sv.atualizado;const r=await api({acao:'salvar',servico:limpo(sv)});
      if(r.aplicado){if(sv.atualizado===at)sv.sincronizado=at}else syncAgain=true;
    }
    DB.excluidos=(DB.excluidos||[]).filter(t=>!t.ok||Date.now()-t.em<90*864e5);
    saveLocal();setSync(pendencias()?'pend':'ok');
  }catch(e){setSync(e.offline?'offline':'erro',e.offline?'':e.message)}
  finally{syncBusy=false;if(syncAgain){syncAgain=false;setTimeout(()=>sincronizar(true),1200)}else if(SYNC.url&&pendencias()&&syncSt==='pend')agendarSync()}
}
function mesclar(rem){
  let mud=false,curGone=false,seedGone=false,curNew=null;const curId=cur&&cur.id;
  rem.forEach(r=>{
    const i=DB.servicos.findIndex(x=>x.id===r.id);const loc=i>=0?DB.servicos[i]:null;
    const tomb=(DB.excluidos||[]).find(t=>t.id===r.id);
    if(r.excluido){if(loc&&(loc.atualizado||0)<=(r.atualizado||0)){DB.servicos.splice(i,1);mud=true;if(curId===r.id)curGone=true}return}
    if(!r.dados||(tomb&&tomb.em>=(r.atualizado||0)))return;
    const d=r.dados;d.atualizado=r.atualizado||d.atualizado;d.sincronizado=d.atualizado;
    if(!loc){normalize(d);DB.servicos.push(d);mud=true;return}
    if((d.atualizado||0)>(loc.atualizado||0)){normalize(d);DB.servicos[i]=d;mud=true;if(curId===r.id)curNew=d}
    else if(d.atualizado===loc.atualizado&&loc.sincronizado!==loc.atualizado){loc.sincronizado=loc.atualizado;mud=true}
  });
  if(rem.some(r=>!r.excluido)&&!rem.some(r=>r.id===SEED_ID)){
    const i=DB.servicos.findIndex(x=>x.id===SEED_ID&&x.atualizado===SEED_TS);
    if(i>=0){DB.servicos.splice(i,1);mud=true;if(curId===SEED_ID)seedGone=true}
  }
  if(!mud)return;
  saveLocal();
  if(curGone||seedGone){cur=null;if(curGone)toast('Este serviço foi excluído em outro aparelho.');location.hash='#/';renderHome();return}
  if(curNew){cur=curNew;renderEditor(true);toast('Serviço atualizado com o que foi salvo em outro aparelho.');return}
  if(!cur)renderHome();
}
function beacon(){
  if(!SYNC.url||!navigator.sendBeacon)return;
  DB.servicos.filter(x=>x.sincronizado!==x.atualizado).forEach(x=>{try{navigator.sendBeacon(SYNC.url,new Blob([JSON.stringify({acao:'salvar',token:SYNC.token,servico:limpo(x)})],{type:'text/plain;charset=utf-8'}))}catch(e){}});
}

/* ---------- estrutura ---------- */
let cur=null,R=null,PR=null,undoSnap=null,ui={dadosOpen:window.innerWidth>760,view:'cargas',printMode:'quadro',qOpen:{}};
const rootOf=s=>s.quadros.find(q=>q.tipo==='medidor')||s.quadros[0];
const qById=id=>cur.quadros.find(q=>q.id===id);
const cById=id=>cur.circuitos.find(c=>c.id===id);
const kidsOf=(s,id)=>s.quadros.filter(q=>q.pai===id);
function descendants(s,id){const out=new Set();const st=[id];while(st.length){const x=st.pop();kidsOf(s,x).forEach(k=>{if(!out.has(k.id)){out.add(k.id);st.push(k.id)}})}return out}
function ordemQuadros(s){const out=[];const seen=new Set();const go=q=>{if(seen.has(q.id))return;seen.add(q.id);out.push(q);kidsOf(s,q.id).sort(byF).forEach(go)};go(rootOf(s));s.quadros.forEach(q=>{if(!seen.has(q.id))go(q)});return out}
const ordC=c=>c&&c.ordem!=null&&isFinite(c.ordem)?c.ordem:1e9;
const ordF=k=>k&&k.alim&&k.alim.ordem!=null&&isFinite(k.alim.ordem)?k.alim.ordem:1e9;
const byC=(a,b)=>(ordC(a)-ordC(b))||natSort(a.codigo,b.codigo);
const byF=(a,b)=>(ordF(a)-ordF(b))||natSort(a.alim.codigo,b.alim.codigo);
function itensQuadro(s,q){
  const it=s.circuitos.filter(c=>c.quadroId===q.id).map(c=>({k:'c',cod:c.codigo,ord:ordC(c),o:c}));
  kidsOf(s,q.id).forEach(k=>it.push({k:'f',cod:k.alim.codigo,ord:ordF(k),o:k}));
  return it.sort((a,b)=>(a.ord-b.ord)||natSort(a.cod,b.cod));
}
function proximaOrdem(s,q){return itensQuadro(s,q).reduce((m,x)=>Math.max(m,x.ord<1e9?x.ord:-1),-1)+1}
function garantirOrdem(s){
  s.quadros.forEach(q=>{
    itensQuadro(s,q).forEach((x,i)=>{if(x.k==='c')x.o.ordem=i;else x.o.alim.ordem=i});
  });
}
function nextCode(s,q){
  const p=q.prefixo||'';let mx=0;
  const codes=s.circuitos.filter(c=>c.quadroId===q.id).map(c=>c.codigo).concat(kidsOf(s,q.id).map(k=>k.alim.codigo));
  codes.forEach(c=>{c=String(c||'');if(c.toUpperCase().startsWith(p.toUpperCase())){const n=parseInt(c.slice(p.length),10);if(isFinite(n)&&n>mx)mx=n}});
  return p+(mx+1);
}
function escolheFase(set,n,load){
  const op=optsFor(set,Math.min(n,set.length));let best=op[0],bs=Infinity;
  op.forEach(o=>{const L=o.split('');const t={...load};L.forEach(l=>t[l]+=1/L.length);const sc=set.split('').reduce((a,l)=>a+t[l]*t[l],0);if(sc<bs){bs=sc;best=o}});
  return best;
}
function normalize(s){
  if(!s.conc)s.conc='coelba';if(!s.metodo)s.metodo='norma';if(!s.uso)s.uso='res';if(!s.tipoEdif)s.tipoEdif='lojas';if(!s.isoEnt)s.isoEnt='XLPE';if(!s.ramalEnt)s.ramalEnt='aereo';if(s.perdas==null)s.perdas=10;
  let ch=0;const root=rootOf(s);const full=SIS[s.sistema]?SIS[s.sistema].fases:'RST';
  s.quadros.forEach(q=>{if(q!==root&&!s.quadros.some(x=>x.id===q.pai)){q.pai=root.id;ch++}if(!q.alim)q.alim={codigo:'',dj:'',cabo:'',comp:''}});
  const rootOld=root.fases||full;root.fases=full;root.pai=null;
  const seen=new Set();
  const ajustaC=(c,set,load)=>{
    if(c.fases0&&c.fases0!==c.fases&&sub(c.fases0,set)){c.fases=c.fases0;delete c.fases0;return 1}
    if(c.fases&&sub(c.fases,set))return 0;
    if(!c.fases0&&c.fases)c.fases0=c.fases;
    c.fases=escolheFase(set,(c.fases||'R').length,load);return 1;
  };
  const visit=(q,pOld,pNew)=>{
    if(seen.has(q.id))return;seen.add(q.id);
    const qOld=q.fases||pOld;
    if(q!==root){
      if(q.fases0&&q.fases0!==q.fases&&sub(q.fases0,pNew)){q.fases=q.fases0;delete q.fases0;ch++}
      else if(qOld===pOld&&pOld!==pNew){if(qOld.length>pNew.length&&!q.fases0)q.fases0=qOld;q.fases=pNew;ch++}
      else if(!sub(qOld,pNew)){if(!q.fases0)q.fases0=qOld;q.fases=escolheFase(pNew,qOld.length,{R:0,S:0,T:0});ch++}
    }
    const set=q.fases;const load={R:0,S:0,T:0};
    const cs=s.circuitos.filter(c=>c.quadroId===q.id);
    cs.forEach(c=>{const ok=c.fases0&&sub(c.fases0,set)?c.fases0:(c.fases&&sub(c.fases,set)?c.fases:null);if(ok)ok.split('').forEach(l=>load[l]+=1/ok.length)});
    cs.forEach(c=>{const was=c.fases;const r=ajustaC(c,set,load);if(r){ch++;if(!(was&&sub(was,set)))c.fases.split('').forEach(l=>load[l]+=1/c.fases.length)}});
    kidsOf(s,q.id).forEach(k=>visit(k,qOld,q.fases));
  };
  visit(root,rootOld,full);
  s.quadros.forEach(q=>{if(!seen.has(q.id)){q.pai=root.id;ch++;visit(q,root.fases,root.fases)}});
  const ids=new Set(s.quadros.map(q=>q.id));
  const n0=s.circuitos.length;s.circuitos=s.circuitos.filter(c=>ids.has(c.quadroId));if(s.circuitos.length!==n0)ch++;
  garantirOrdem(s);
  return ch;
}

/* ---------- cálculo ---------- */
function dim(x,min,djU,caboU,comp,lc,fca,rho,izTab){
  if(!(x.ib>0))return {sugDj:null,In:null,sugCabo:null,cabo:null,iz:null,dv:null,porDv:false};
  const sugDj=BR.find(b=>b>=x.ib-1e-9)||null;
  const In=pos(djU,0)||sugDj;
  const arr=(izTab||IZ)[x.cond];const L=pos(comp,0);
  const dvOf=sc=>L>0?x.k*rho*L*x.ib/sc/x.v*100:null;
  let izOnly=null,sug=null;
  for(let i=0;i<SEC.length;i++){
    const sc=SEC[i];if(sc<min-1e-9)continue;
    if(arr[i]*fca<(In||x.ib)-1e-9)continue;
    if(izOnly==null)izOnly=sc;
    const dv=dvOf(sc);if(lc!=null&&dv!=null&&dv>lc)continue;
    sug=sc;break;
  }
  const cabo=pos(caboU,0)||sug;
  const ci=cabo?SEC.findIndex(v=>Math.abs(v-cabo)<1e-9):-1;
  return {sugDj,In,sugCabo:sug,porDv:sug!=null&&izOnly!=null&&sug!==izOnly,cabo,iz:ci>=0?arr[ci]*fca:null,dv:cabo?dvOf(cabo):null};
}
function mensagens(x,o){
  const m=[];
  if(x.fpBad)m.push('FP deve ficar entre 0 e 1');
  if(!(x.ib>0))return m;
  if(o.faseOk===false)m.push('fase não disponível neste quadro');
  if(!x.In){m.push('corrente acima de 200 A, definir o disjuntor');return m}
  if(x.In<x.ib-1e-9)m.push(`disjuntor de ${nf(x.In,0)} A menor que a corrente de projeto (${nf(x.ib,1)} A)`);
  if(!x.cabo){m.push('seção acima de 120 mm², definir o cabo');return m}
  if(x.iz==null)m.push(`seção de ${nf(x.cabo,1)} mm² fora da tabela de cabos`);
  else{
    if(x.cabo<o.min-1e-9)m.push(`seção abaixo do mínimo da NBR 5410 (${nf(o.min,1)} mm²)`);
    if(x.In>x.iz+1e-9)m.push(`disjuntor de ${nf(x.In,0)} A maior que a capacidade do cabo (Iz ${nf(x.iz,1)} A)`);
  }
  if(o.lc!=null&&x.dv!=null&&x.dv>o.lc+1e-9)m.push(`queda de tensão no circuito de ${nfx(x.dv,2)}% (máx. ${nf(o.lc,1)}%)`);
  if(x.dvt!=null&&x.dvt>o.lt+1e-9)m.push(`queda de tensão total de ${nfx(x.dvt,2)}% (máx. ${nf(o.lt,1)}%)`);
  return m;
}
/* ---------- DIS-NOR-030: categorias de demanda ---------- */
function demAuto(c){
  if(c.tipo==='RES')return 'x';
  if(c.tipo==='ILU'||c.tipo==='TUG')return 'a';
  const d=' '+String(c.desc||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()+' ';
  if(isVE(c))return 'j';
  if(/chuveiro|ducha|torneira|aquecedor de passagem|ferro de passar/.test(d))return 'b';
  if(/boiler|acumulacao|aquecedor central|aquecimento central/.test(d))return 'c';
  if(/secadora|lava.?lou|lava.?roupa|lavadora|maquina de lavar|micro.?ondas|forno/.test(d))return 'd';
  if(/fogao|cooktop|cook top|inducao/.test(d))return 'e';
  if(/[^a-z]ar[^a-z]|ar.?condicionado|condicionador|split|[^a-z]ac[^a-z]/.test(d))return 'f';
  if(/bomba|hidromassagem|piscina|pressuriza|ofuro|banheira/.test(d))return 'i';

        const s0=score(load);const t={...load};
        addD(t,dist(a.o,a.va),-1);addD(t,dist(b.o,b.va),-1);addD(t,dist(b.o,a.va),1);addD(t,dist(a.o,b.va),1);
        if(score(t)<s0-1e-6){const ao=a.o;a.o=b.o;b.o=ao;PH.forEach(l=>load[l]=t[l]);imp=true;break outer}
      }
    }
    if(!imp)break;
  }

}
function balancearTudo(s){
  const ordem=ordemQuadros(s).reverse();let ch=0;ordem.forEach(q=>ch+=balancearQuadro(s,q));return ch;
}

/* ---------- proteções ---------- */
const isVE=c=>/carreg|recarga|ve[ií]cul|wallbox|\bVE\b/i.test(c.desc||'');
function drReq(c,x){
  const v=c.dr||'auto';if(v!=='auto')return v;
  if(c.tipo==='ILU'||c.tipo==='RES')return 'nao';
  if(c.tipo==='TUE'){if(isVE(c))return 'A';if((x.In||0)>=32)return 'excl'}
  return 'sim';
}
function dpsOn(s,q){const v=q.dps||'auto';if(v!=='auto')return v==='sim';const root=rootOf(s);if(q===root)return s.circuitos.some(c=>c.quadroId===q.id);return q.pai===root.id}
const reservaNBR=n=>n<=6?2:n<=12?3:n<=30?4:Math.ceil(0.15*n);
function calcProt(s,R){
  const root=rootOf(s);const curva=s.curva||'C';const {vfn}=R;const P={q:{},c:{},all:[]};
  const uc=UCS.find(u=>u>=1.1*vfn-1e-9)||440;
  s.circuitos.forEach(c=>{P.c[c.id]={req:'nao',grp:null}});
  const faseIn=cs=>{const p={R:0,S:0,T:0};cs.forEach(c=>{const In=(R.c[c.id]&&R.c[c.id].In)||0;c.fases.split('').forEach(l=>p[l]+=In)});return Math.max(p.R,p.S,p.T)};
  ordemQuadros(s).forEach(q=>{
    const isRoot=q===root;
    const cs=s.circuitos.filter(c=>c.quadroId===q.id).sort(byC);
    const kids=kidsOf(s,q.id).sort(byF);
    const modo=q.drModo||'tipo';const maxN=Math.max(1,Math.round(pos(q.drMax,5)));
    const groups=[];const pend={TUG:[],TUE:[],outros:[]};
    cs.forEach(c=>{
      const x=R.c[c.id];if(!x)return;const req=drReq(c,x);P.c[c.id].req=req;if(req==='nao')return;
      if(req==='excl'||req==='A'||req==='B'||modo==='individual')groups.push({tipo:req==='A'?'A':req==='B'?'B':'AC',cs:[c]});
      else (modo==='unico'?pend.outros:(c.tipo==='TUE'?pend.TUE:pend.TUG)).push(c);
    });
    ['TUG','TUE','outros'].forEach(k=>{let g=null;pend[k].forEach(c=>{
      if(!g||(modo!=='unico'&&(g.cs.length>=maxN||faseIn(g.cs.concat(c))>63))){g={tipo:'AC',cs:[]};groups.push(g)}
      g.cs.push(c)})});
    groups.sort((a,b)=>ordC(a.cs[0])-ordC(b.cs[0]));
    groups.forEach((g,i)=>{
      g.label='DR'+(i+1);g.need=faseIn(g.cs);g.In=DRR.find(v=>v>=g.need-1e-9)||null;
      const L=new Set();g.cs.forEach(c=>c.fases.split('').forEach(l=>L.add(l)));
      g.polos=(L.size===1||(L.size===2&&g.cs.every(c=>c.fases===g.cs[0].fases&&c.fases.length===2)))?2:4;
      g.cs.forEach(c=>P.c[c.id].grp=g.label);
    });
    const n=q.fases.length;const items=[];
    const rootMerge=isRoot&&cs.length===0&&kids.length===1;
    const geralSkip=!isRoot&&(q.geral||'sim')==='nao';
    const geralIn=isRoot?R.ent.In:(R.f[q.id]?R.f[q.id].In:null);
    if(!geralSkip)items.push({tag:'Geral',disp:'Disjuntor termomagnético',spec:`${n}P ${geralIn?geralIn+' A':'a definir'} curva ${curva}${isRoot&&R.ent.cat&&geralIn?`, NBR IEC 60898, mín. ${geralIn>125?10:5} kA`:''}`,qtd:1,
      refs:[rootMerge?{t:`Entrada e ${kids[0].alim.codigo} (${kids[0].nome})`,qid:kids[0].id}:{t:isRoot?'Entrada':'Entrada do quadro'}],mod:n});
    const dps=dpsOn(s,q);
    if(dps)items.push({tag:'DPS',disp:'DPS classe II',spec:`20 kA (8/20 µs), Uc ${uc} V`,qtd:n+1,refs:[{t:q.fases.split('').join(', ')+' e N'}],mod:n+1});
    groups.forEach(g=>items.push({tag:g.label,disp:`Interruptor DR ${g.polos}P`,spec:`${g.In?g.In+' A':'acima de 125 A'}, 30 mA, tipo ${g.tipo}`,qtd:1,refs:g.cs.map(c=>({t:c.codigo,cid:c.id})),mod:g.polos}));
    const bk={};
    const addB=(p,In,ref)=>{const key=p+'|'+(In||'x');(bk[key]=bk[key]||{p,In,refs:[]}).refs.push(ref)};
    cs.forEach(c=>{const x=R.c[c.id];if(x)addB(c.fases.length,x.In,{t:c.codigo,cid:c.id})});
    if(!rootMerge)kids.forEach(k=>{const f=R.f[k.id];addB(k.fases.length,f?f.In:null,{t:`${k.alim.codigo} (${k.nome})`,qid:k.id})});
    Object.values(bk).sort((a,b)=>(a.p-b.p)||((a.In||999)-(b.In||999))).forEach(b=>items.push(b.In?
      {disp:'Disjuntor termomagnético',spec:`${b.p}P ${b.In} A curva ${curva}`,qtd:b.refs.length,refs:b.refs,mod:b.p*b.refs.length}:
      {disp:'Espaço reserva',spec:`${b.p}P, disjuntor a definir`,qtd:b.refs.length,refs:b.refs,mod:b.p*b.refs.length,res:true}));
    const isQD=!isRoot||cs.length>0;const nCirc=cs.length+kids.length;const reserva=isQD?reservaNBR(nCirc):0;
    const mod=items.reduce((a,i)=>a+i.mod,0)+reserva;const caixa=CAIXAS.find(v=>v>=mod)||mod;
    P.q[q.id]={groups,items,dps,uc,reserva,mod,caixa,nCirc,geralIn,geralSkip,rootMerge,n,isQD,isRoot};
  });
  const agg={};const cat=d=>d.startsWith('Quadro')?0:d.startsWith('Disjuntor')?1:d.startsWith('Interruptor')?2:3;
  const add=(disp,spec,qtd,qn)=>{const k=disp+'|'+spec;const a=agg[k]=agg[k]||{disp,spec,qtd:0,q:[]};a.qtd+=qtd;if(!a.q.includes(qn))a.q.push(qn)};
  ordemQuadros(s).forEach(q=>{const pq=P.q[q.id];
    if(pq.isQD)add('Quadro de distribuição de embutir',`${pq.caixa} módulos DIN, barramentos ${alimLbl(q.fases)} e PE`,1,q.nome);
    pq.items.forEach(it=>{if(!it.res)add(it.disp,it.spec,it.qtd,q.nome)})});
  P.all=Object.values(agg).sort((a,b)=>(cat(a.disp)-cat(b.disp))||natSort(a.disp+a.spec,b.disp+b.spec));
  return P;
}

const sR=(x,y,w,h,o={})=>`<rect${o.cl?` class="${o.cl}"`:''} x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.rx==null?3:o.rx}" fill="${o.f||'#fff'}" stroke="${o.s||'#1F2328'}" stroke-width="${o.w||1.4}"/>`;
const svgWrap=(W,H,inner)=>`<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="width:${W}px;height:${H}px" font-family="${FONT}"><rect x="0" y="0" width="${W}" height="${H}" fill="#fff"/>${inner}</svg>`;

  o+=sT(IX+28,BUS-10,`Barramento ${alimLbl(q.fases)} + PE`,{fs:10.5,c:MUT});
  const label=(cx,l1code,l1,l2)=>`<text x="${cx-3}" y="${LBL}" transform="rotate(-90 ${cx-3} ${LBL})" text-anchor="end" font-size="11" font-family="${FONT}" fill="${INK}"><tspan font-weight="700">${esc(l1code)}</tspan><tspan dx="5">${esc(l1)}</tspan></text>`+
    `<text x="${cx+10}" y="${LBL}" transform="rotate(-90 ${cx+10} ${LBL})" text-anchor="end" font-size="10" font-family="${FONT}" fill="${MUT}">${esc(l2)}</text>`;

function interSVG(s,R,P){

    kids.forEach(k=>lay(k,d+1));

    o+=`<path d="M${px} ${py} V${my} H${cx} V${cy}" fill="none" stroke="${INK}" stroke-width="1.6"/>`;
    const f=R.f[q.id];
    o+=sT(cx+8,my+22,esc(`${q.alim.codigo||'?'} · ${f&&f.In?f.In+' A':'?'} · #${f&&f.cabo?nf(f.cabo,1):'?'} mm²`),{fs:11,fw:700});
    o+=sT(cx+8,my+37,esc(`${alimLbl(q.fases)}${pos(q.alim.comp,0)?' · '+nf(num(q.alim.comp),1)+' m':''}${f&&f.dv!=null?' · ΔV '+nfx(f.dv,2)+'%':''}`),{fs:10.5,c:MUT});
  });
  s.quadros.forEach(q=>{
    const pp=ps[q.id];if(!pp)return;const t=R.q[q.id];const pq=P.q[q.id];const isR=q===root;

    o+=sT(pp.x+12,pp.y+23,esc(q.nome),{fs:14,fw:700,c:BRD})+sT(pp.x+12,pp.y+41,esc(trunc(q.descricao,32)),{fs:11,c:MUT});
    const l3=isR?`${R.ent.cat?R.ent.cat.cat+' · ':''}${nf(R.ent.D/1000,1)} kVA dem. · ${R.ent.In?R.ent.In+' A':'?'}`:`${nf(t.va/1000,2)} kVA · ${alimLbl(q.fases)}`+(pq&&pq.isQD?` · ${pq.caixa} mód.`:'');

}

function focusKey(){
  const el=document.activeElement;if(!el||!app.contains(el))return null;
  const a=['f','ff','qf','sf','ef'].find(k=>el.dataset&&el.dataset[k]!=null);if(!a)return null;
  const row=el.closest('[data-cid]'),fq=el.closest('[data-fq]'),q=el.closest('[data-qid]');
  return {a,v:el.dataset[a],cid:row&&row.dataset.cid,fq:fq&&fq.dataset.fq,qid:q&&q.dataset.qid,ss:el.selectionStart,se:el.selectionEnd};
}
function restoreFocus(k){
  if(!k)return;let scope=app;
  if(k.cid)scope=app.querySelector(`[data-cid="${k.cid}"]`);else if(k.fq)scope=app.querySelector(`[data-fq="${k.fq}"]`);else if(k.qid)scope=app.querySelector(`[data-qid="${k.qid}"]`);
  if(!scope)return;const el=scope.querySelector(`[data-${k.a}="${k.v}"]`);if(!el)return;
  el.focus({preventScroll:true});try{if(k.ss!=null)el.setSelectionRange(k.ss,k.se)}catch(e){}
}

function eletrodutoPara(conds,fam){
  const a=conds.reduce((t,[S,iso])=>{const d=(DEXT[iso]||DEXT.PVC)[S]||2*Math.sqrt(S);return t+Math.PI*d*d/4},0);

  const r=(fam==='flex'?ELF:ELR).find(([,id])=>Math.PI*id*id/4*k>=a-1e-9);
  return r?r[0]:null;
}

    s.circuitos.filter(c=>c.quadroId===q.id).sort(byC).forEach(c=>{
      const x=r.c[c.id];if(!(x.ib>0)||!x.cabo)return;const L=pos(c.comp,0);
      if(!L){falta.push(`${q.nome} ${c.codigo||'sem código'}`);return}
      const n=c.fases.length,ilu=c.tipo==='ILU';cab(x.cabo,'PVC',FUN.F,n*L);if(ilu)cab(x.cabo,'PVC',FUN.R,L);if(n===1)cab(x.cabo,'PVC',FUN.N,L);cab(x.pe,'PVC',FUN.PE,L);
      const cs=[];for(let i=0;i<n+(n===1?1:0)+(ilu?1:0);i++)cs.push([x.cabo,'PVC']);cs.push([x.pe,'PVC']);
      const dn=eletrodutoPara(cs,'flex');
      add('Eletrodutos',dn?`Eletroduto flexível corrugado ${dn}`:'Eletroduto flexível corrugado (acima de DN 40)','PVC, embutido, circuitos terminais','m',L*k);
    });
    kidsOf(s,q.id).sort(byF).forEach(kq=>{
      const f=r.f[kq.id];if(!f||!(f.ib>0)||!f.cabo)return;const L=pos(kq.alim.comp,0);
      if(!L){falta.push(`${q.nome} ${kq.alim.codigo||'sem código'} (alimentação ${kq.nome})`);return}
      const iso=f.ramal&&f.iso==='XLPE'?'XLPE':'PVC';const n=kq.fases.length;
      cab(f.cabo,iso,FUN.F,n*L);cab(f.cabo,iso,FUN.N,L);cab(f.pe,iso,FUN.PE,L);
      const cs=[];for(let i=0;i<n+1;i++)cs.push([f.cabo,iso]);cs.push([f.pe,iso]);
      const dn=eletrodutoPara(cs,'rig');
      add('Eletrodutos',dn?`Eletroduto rígido rosqueável ${dn}`:'Eletroduto rígido rosqueável (acima de 3")','PVC (NBR 15465), alimentadores','m',L*k,`${kq.alim.codigo||''} ${kq.nome}`.trim());
    });
  });
  const catP=d=>d.startsWith('Disjuntor')?1:d.startsWith('Interruptor')?2:3;
  const kEl=t=>{const f=ELF.findIndex(x=>t.endsWith(' '+x[0]));if(f>=0)return f;const r=ELR.findIndex(x=>t.endsWith(' '+x[0]));return r>=0?10+r:99};
  const ord=g=>g.it.sort((a,b)=>g.nome==='Condutores'?(secFase(a.item.replace('Cabo ',''))-secFase(b.item.replace('Cabo ','')))||natSort(a.esp,b.esp):
    g.nome==='Dispositivos de proteção'?(catP(a.item)-catP(b.item))||natSort(a.item+a.esp,b.item+b.esp):
    g.nome==='Eletrodutos'?kEl(a.item)-kEl(b.item):0);
  G.forEach(g=>{ord(g);g.it.forEach(i=>{i.q=i.un==='m'?Math.ceil(i.q-1e-9):Math.round(i.q);if(i.un==='m'&&/^Eletroduto rígido|^Eletroduto do ramal/.test(i.item))i.obs.push(`${Math.ceil(i.q/3)} barra${Math.ceil(i.q/3)===1?'':'s'} de 3 m`)})});
  const notas=[`Cabos e eletrodutos pelos comprimentos informados em cada circuito e alimentador, com acréscimo de ${nf(per,1)}% para sobras e perdas.`,
    'Um eletroduto por circuito; trechos compartilhados reduzem a quantidade. Diâmetros pela taxa de ocupação da NBR 5410 (53%, 31% e 40% para 1, 2 e 3 ou mais condutores), com diâmetros externos médios de catálogo; confirmar com o fabricante.',
    'Circuitos de iluminação com fase, retorno, neutro e PE, considerando um retorno ao longo de todo o comprimento do circuito; interruptores paralelos ou intermediários pedem retornos adicionais. Demais circuitos F+N com fase, neutro e PE; circuitos F+F e trifásicos com fases e PE; alimentadores com fases, neutro e PE.',
    'Não incluídos: pontos de tomada e de interruptor (tomadas, interruptores e caixas 4x2), luminárias, caixas de passagem, poste ou pontalete, luvas, curvas internas, abraçadeiras, terminais e conectores.'];
  if(e.cat&&e.ramalDist)notas.push('Ramal de entrada fornecido, instalado e mantido pela distribuidora (Anexo I, nota 10).');
  if(e.cat)notas.push('Poste ou pontalete conforme o local, pelas Tabelas 23 e 24 e pela DIS-ETE-146.');
  return {G:G.filter(g=>g.it.length),falta,per,notas};
}

function wireSheet(bg){

    if(t.dataset.f!=null){const c=cById(sheetSt.id);if(!c)return;setC(c,t.dataset.f,t.value);touch();refresh();return}

  });

    const t=e.target;if(!cur||!sheetSt)return;
    if(t.dataset.sh==='fixo'){const c=cById(sheetSt.id);if(!c)return;c.fixo=t.checked;touch();refresh();return}

      snapshot();c.quadroId=q.id;c.ordem=proximaOrdem(cur,q);const ch=normalize(cur);touch();renderEditor(true);openSheet('c',c.id);
      toast(`Circuito ${c.codigo} movido para ${q.nome}.`+(ch?' Fases ajustadas ao novo quadro.':''),true);}
  });

    const b=e.target.closest('[data-sv]');if(!b||!sheetSt)return;const c=cById(sheetSt.id);if(!c)return;
    if(b.dataset.sv==='tipo'){setC(c,'tipo',b.dataset.v);touch();refresh();return}

app.addEventListener('change',e=>{
  const t=e.target;if(!cur||t.tagName!=='SELECT')return;
  if(t.dataset.qf!=null){
    const q=qById(t.closest('[data-qid]').dataset.qid);q[t.dataset.qf]=t.value;if(t.dataset.qf==='fases')delete q.fases0;
    if(!['pai','fases'].includes(t.dataset.qf)){touch();refresh();return}
    if(t.dataset.qf==='pai'){const p=qById(q.pai);if(p&&!sub(q.fases,p.fases))q.fases=p.fases;q.alim.codigo=nextCode(cur,p);q.alim.ordem=1e6}
    const ch=normalize(cur);touch();renderEditor(true);if(ch)toast(`Fases ajustadas em ${ch} ite${ch===1?'m':'ns'} para caber no quadro.`);return;
  }
  if(t.dataset.sf!=null){
    if(!['sistema','tensao'].includes(t.dataset.sf)){cur[t.dataset.sf]=t.value;touch();if(['metodo','uso','conc'].includes(t.dataset.sf))renderEditor(true);else refresh();return}
    snapshot();cur[t.dataset.sf]=t.value;const ch=normalize(cur);touch();renderEditor(true);
    toast(ch?`Sistema alterado. Fases ajustadas em ${ch} ite${ch===1?'m':'ns'}; use "Balancear tudo" se quiser redistribuir.`:'Sistema alterado.',true);return;
  }
});
app.addEventListener('toggle',e=>{if(e.target.matches&&e.target.matches('[data-dados]'))ui.dadosOpen=e.target.open},true);
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a!=='open')e.stopPropagation();
  if(b.closest('#amenu'))closeMenu(1);
  if(b.closest('#csheet')&&(a==='delc'||a==='goto'))closeSheet(2);
  switch(a){
    case 'nop':break;
    case 'msheet':openSheet(b.dataset.cid?'c':'f',b.dataset.cid||b.dataset.fq);break;
    case 'closesheet':closeSheet(1);break;
    case 'menu':openMenu();break;
    case 'fab':{const q=quadroVisivel();if(q)addCircuit(q);break;}
    case 'mqedit':{const id=b.dataset.q;ui.qOpen=ui.qOpen||{};ui.qOpen[id]=!ui.qOpen[id];const ar=document.getElementById('q-'+id);if(ar)ar.classList.toggle('qopen',ui.qOpen[id]);b.textContent=ui.qOpen[id]?'Fechar':'Editar';break;}
    case 'dados':{ui.dadosOpen=true;const d=app.querySelector('[data-dados]');if(d){d.open=true;setTimeout(()=>window.scrollTo({top:0,behavior:'smooth'}),40)}break;}
    case 'home':location.hash='#/';break;
    case 'open':location.hash='#/s/'+b.dataset.id;break;
    case 'newsrv':{const s=criarServico({nome:'Novo serviço'});const q0=rootOf(s);
      s.quadros.push({id:uid(),tipo:'distribuicao',nome:'QD1',descricao:'Quadro de distribuição',prefixo:'A',pai:q0.id,fases:q0.fases,fd:1,alim:{codigo:'AL',dj:'',cabo:'',comp:''}});
      DB.servicos.push(s);saveNow();ui.dadosOpen=true;location.hash='#/s/'+s.id;
      setTimeout(()=>{const i=app.querySelector('[data-sf="nome"]');if(i){i.focus();i.select()}},60);break;}
    case 'dupsrv':{e.preventDefault();const s=DB.servicos.find(x=>x.id===b.dataset.id);if(!s)break;const c=JSON.parse(JSON.stringify(s));c.id=uid();c.nome=s.nome+' (cópia)';c.criado=c.atualizado=Date.now();DB.servicos.push(c);saveNow();renderHome();toast('Serviço duplicado.');break;}
    case 'delsrv':{const s=DB.servicos.find(x=>x.id===b.dataset.id);if(!s)break;if(!confirm(`Excluir o serviço "${s.nome}"? Essa ação não pode ser desfeita.`))break;DB.servicos=DB.servicos.filter(x=>x.id!==s.id);(DB.excluidos=DB.excluidos||[]).push({id:s.id,em:Date.now()});saveNow();renderHome();toast('Serviço excluído.');break;}
    case 'import':$('#fileImp').value='';$('#fileImp').click();break;
    case 'export':exportBackup();break;
    case 'addc':addCircuit(qById(b.dataset.q));break;
    case 'delc':{const tr=b.closest('[data-cid]');const c=cById(tr.dataset.cid);if(!c)break;snapshot();cur.circuitos=cur.circuitos.filter(x=>x.id!==c.id);touch();renderEditor(true);toast(`Circuito ${c.codigo||''} excluído.`,true);break;}
    case 'lock':{const tr=b.closest('[data-cid]');const c=cById(tr.dataset.cid);if(!c)break;c.fixo=!c.fixo;b.classList.toggle('on',c.fixo);b.title=c.fixo?'Fase fixa: o balanceamento não mexe neste circuito':'Fixar fase no balanceamento';touch();break;}
    case 'addq':addQuadro(qById(b.dataset.q));break;
    case 'delq':delQuadro(qById(b.dataset.q));break;
    case 'bal':{const q=qById(b.dataset.q);snapshot();const ch=balancearQuadro(cur,q);touch();renderEditor(true);toast(ch?`${ch} circuito${ch===1?'':'s'} ${ch===1?'mudou':'mudaram'} de fase em ${q.nome}.`:`${q.nome} já está no melhor equilíbrio possível.`,ch>0);break;}
    case 'balall':{snapshot();const ch=balancearTudo(cur);touch();renderEditor(true);toast(ch?`${ch} circuito${ch===1?'':'s'} ${ch===1?'mudou':'mudaram'} de fase.`:'Os quadros já estão no melhor equilíbrio possível.',ch>0);break;}
    case 'goto':goTo(b.dataset.q);break;
    case 'renum':{const q=qById(b.dataset.q);if(!q)break;snapshot();
      itensQuadro(cur,q).forEach((x,i)=>{const cod=(q.prefixo||'')+(i+1);if(x.k==='c')x.o.codigo=cod;else x.o.alim.codigo=cod});
      touch();renderEditor(true);toast(`Circuitos de ${q.nome} renumerados na ordem atual.`,true);break;}
    case 'syncpanel':syncPanel();break;
    case 'closemodal':closeModal();break;
    case 'synctest':{
      const url=$('#syUrl').value.trim(),tok=$('#syTok').value.trim(),er=$('#syErr');
      const show=m=>{er.style.display=m?'flex':'none';er.innerHTML=m?I.alert+'<span>'+esc(m)+'</span>':''};
      if(!/^https?:\/\/\S+$/.test(url)){show('Cole o URL do app da Web, que começa com https://script.google.com/');break}
      if(!tok){show('Informe a chave escrita no script.');break}
      show('');b.disabled=true;b.textContent='Testando...';
      api({acao:'ping'},{url,token:tok}).then(j=>{
        SYNC.url=url;SYNC.token=tok;saveSync();closeModal();renderTop();
        toast(`Conectado. ${j.total} serviço${j.total===1?'':'s'} na planilha.`);sincronizar(true);
      }).catch(e=>{show(e.message);b.disabled=false;b.textContent='Testar e salvar'});
      break;}
    case 'syncnow':sincronizar(true);break;
    case 'syncoff':{if(!confirm('Desligar a sincronização neste aparelho? Os serviços continuam salvos aqui e na planilha.'))break;clearTimeout(syncT);SYNC={url:'',token:'',ultimo:0};saveSync();setSync('off');closeModal();renderTop();if(!cur)renderHome();toast('Sincronização desligada neste aparelho.');break;}
    case 'copygas':{
      const ok=()=>toast('Código do Apps Script copiado.');
      const fb=()=>{const ta=document.createElement('textarea');ta.value=GAS_CODE;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(e){toast('Não foi possível copiar.')}ta.remove()};
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(GAS_CODE).then(ok).catch(fb);else fb();
      break;}
    case 'view':{ui.view=b.dataset.v;renderEditor(true);const sb=app.querySelector('.segbar');if(sb){const th=document.querySelector('.top').offsetHeight;const y=sb.getBoundingClientRect().top+window.scrollY-th;if(window.scrollY>y)window.scrollTo(0,y)}break;}
    case 'gocirc':{const id=b.dataset.cid;if(isMob()){if(ui.view!=='cargas'){ui.view='cargas';renderEditor(false)}openSheet('c',id);break}if(ui.view!=='cargas'){ui.view='cargas';renderEditor(false)}const row=app.querySelector(`tr[data-cid="${id}"]`);if(row){row.scrollIntoView({behavior:'smooth',block:'center'});row.classList.remove('flash');void row.offsetWidth;row.classList.add('flash');const d=row.querySelector('[data-f="desc"]');if(d)d.focus({preventScroll:true})}break;}
    case 'svg':{const k=b.dataset.k;const box=k==='dgi'?app.querySelector('[data-dgi]'):app.querySelector(`[data-dg="${k}"]`);const sv=box&&box.querySelector('svg');if(!sv)break;
      const cl=sv.cloneNode(true);cl.removeAttribute('style');cl.removeAttribute('class');cl.querySelectorAll('[data-act]').forEach(n=>{n.removeAttribute('data-act');n.removeAttribute('data-q');n.removeAttribute('data-cid');n.removeAttribute('class')});
      const qn=k==='dgi'?'Interligacao':'Unifilar_'+((qById(k)||{}).nome||'');download(`${fileName(qn)}_${fileName(cur.nome)}.svg`,'<?xml version="1.0" encoding="UTF-8"?>\n'+cl.outerHTML,'image/svg+xml');toast('Diagrama baixado.');break;}
    case 'print':ui.printMode='quadro';buildPrint();setTimeout(()=>window.print(),50);break;
    case 'memorial':ui.printMode='memo';buildMemorial();setTimeout(()=>window.print(),80);break;
    case 'memword':exportWord();break;
    case 'install':{if(!instEvt)break;const ev=instEvt;instEvt=null;ev.prompt();ev.userChoice.finally(()=>renderTop());break;}
    case 'matcsv':exportMatCSV();break;
    case 'csv':exportCSV();break;
    case 'copy':copyTSV();break;
    case 'undo':{if(!undoSnap)break;const s=JSON.parse(undoSnap.json);s.atualizado=Date.now();const i=DB.servicos.findIndex(x=>x.id===undoSnap.id);if(i>=0){DB.servicos[i]=s;if(cur&&cur.id===s.id){cur=s;renderEditor(true)}saveNow()}undoSnap=null;const el=$('.toast');if(el)el.remove();break;}
  }
});
let drag=null;
function linhasTb(tb){return [...tb.children].filter(r=>r.dataset.cid||r.dataset.fq)}
function gravarOrdem(tb){linhasTb(tb).forEach((r,j)=>{if(r.dataset.cid){const c=cById(r.dataset.cid);if(c)c.ordem=j}else{const k=qById(r.dataset.fq);if(k)k.alim.ordem=j}})}
function moverPara(x,y){
  if(!drag)return;
  const el=document.elementFromPoint(x,y);const tb=el&&el.closest('[data-tb]');
  app.querySelectorAll('.drop-target').forEach(t=>{if(t!==tb)t.classList.remove('drop-target')});
  if(!tb||(drag.isF&&tb!==drag.from))return;
  const rows=linhasTb(tb).filter(r=>r!==drag.tr);let alvo=null;
  for(const r of rows){const bb=r.getBoundingClientRect();if(y<bb.top+bb.height/2){alvo=r;break}}
  if(alvo){if(alvo.previousElementSibling!==drag.tr||drag.tr.parentElement!==tb)tb.insertBefore(drag.tr,alvo)}
  else if(tb.lastElementChild!==drag.tr)tb.appendChild(drag.tr);
  const vazio=tb.querySelector('.empty-row');if(vazio)vazio.style.display='none';
  tb.classList.toggle('drop-target',tb!==drag.from);
}
function rolarArrastando(){
  if(!drag||!drag.started)return;
  const topo=(document.querySelector('.top')||{offsetHeight:0}).offsetHeight+60,base=window.innerHeight-60;let dy=0;
  if(drag.y<topo)dy=-Math.ceil((topo-drag.y)/5);else if(drag.y>base)dy=Math.ceil((drag.y-base)/5);
  if(dy){window.scrollBy(0,dy);moverPara(drag.x,drag.y)}
  drag.raf=requestAnimationFrame(rolarArrastando);
}
app.addEventListener('pointerdown',e=>{
  const g=e.target.closest('[data-grip]');if(!g||(e.pointerType==='mouse'&&e.button!==0))return;
  const tr=g.closest('tr,.mrow');if(!tr)return;e.preventDefault();
  drag={tr,g,from:tr.parentElement,idx0:linhasTb(tr.parentElement).indexOf(tr),isF:!!tr.dataset.fq,id:tr.dataset.cid||tr.dataset.fq,x:e.clientX,y:e.clientY,y0:e.clientY,x0:e.clientX,started:false,pid:e.pointerId,raf:0};
  try{g.setPointerCapture(e.pointerId)}catch(er){}
});
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.pid)return;
  drag.x=e.clientX;drag.y=e.clientY;
  if(!drag.started){
    if(Math.abs(e.clientY-drag.y0)<5&&Math.abs(e.clientX-drag.x0)<5)return;
    drag.started=true;snapshot();drag.tr.classList.add('drag-row');document.body.classList.add('dragging');drag.raf=requestAnimationFrame(rolarArrastando);
  }
  e.preventDefault();moverPara(e.clientX,e.clientY);
},{passive:false});
function fimArraste(cancelou){
  if(!drag)return;const d=drag;drag=null;cancelAnimationFrame(d.raf);
  document.body.classList.remove('dragging');app.querySelectorAll('.drop-target').forEach(t=>t.classList.remove('drop-target'));
  try{d.g.releasePointerCapture(d.pid)}catch(er){}
  if(!d.started)return;
  d.tr.classList.remove('drag-row');
  const tb=d.tr.parentElement;
  if(cancelou||!tb||!tb.dataset.tb){undoSnap=null;renderEditor(true);return}
  if(tb===d.from&&linhasTb(tb).indexOf(d.tr)===d.idx0){undoSnap=null;renderEditor(true);return}
  let msg='Ordem dos circuitos atualizada.';
  if(!d.isF){const c=cById(d.id);if(c&&c.quadroId!==tb.dataset.tb){c.quadroId=tb.dataset.tb;const q=qById(tb.dataset.tb);msg=`Circuito ${c.codigo} movido para ${q?q.nome:'outro quadro'}. Use "Renumerar" se quiser ajustar os códigos.`}}
  gravarOrdem(tb);if(d.from!==tb)gravarOrdem(d.from);
  const ch=normalize(cur);touch();renderEditor(true);
  const rs=isMob()?'.mrow':'tr';const row=app.querySelector(d.isF?`${rs}[data-fq="${d.id}"]`:`${rs}[data-cid="${d.id}"]`);if(row){row.classList.add('flash')}
  toast(msg+(ch?' Fases ajustadas ao novo quadro.':''),true);
}
document.addEventListener('pointerup',e=>{if(drag&&e.pointerId===drag.pid)fimArraste(false)});
document.addEventListener('pointercancel',e=>{if(drag&&e.pointerId===drag.pid)fimArraste(true)});
app.addEventListener('keydown',e=>{
  const g=e.target.closest&&e.target.closest('[data-grip]');if(!g||(e.key!=='ArrowUp'&&e.key!=='ArrowDown'))return;
  e.preventDefault();const tr=g.closest('tr,.mrow'),tb=tr.parentElement,rows=linhasTb(tb),i=rows.indexOf(tr),j=e.key==='ArrowUp'?i-1:i+1;
  if(j<0||j>=rows.length)return;
  if(e.key==='ArrowUp')tb.insertBefore(tr,rows[j]);else tb.insertBefore(tr,rows[j].nextElementSibling);
  gravarOrdem(tb);touch();const id=tr.dataset.cid||tr.dataset.fq,isF=!!tr.dataset.fq;renderEditor(true);
  const rs=isMob()?'.mrow':'tr';const nr=app.querySelector(isF?`${rs}[data-fq="${id}"]`:`${rs}[data-cid="${id}"]`);const ng=nr&&nr.querySelector('[data-grip]');if(ng)ng.focus({preventScroll:false});
});
$('#fileImp').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)importBackup(f)});
window.addEventListener('beforeprint',()=>{if(cur){if(ui.printMode==='memo')buildMemorial();else buildPrint()}});

/* ---------- rotas ---------- */
function route(){
  const m=(location.hash||'').match(/^#\/s\/(.+)$/);
  if(m){const s=DB.servicos.find(x=>x.id===m[1]);if(s){if(cur!==s){cur=s;undoSnap=null;window.scrollTo(0,0)}normalize(s);renderEditor(false);return}}
  renderHome();
}
window.addEventListener('hashchange',route);
setPage('quadro');
load();
syncSt=SYNC.url?'pend':'off';
if(!DB.seedV1){const s=seed();DB.servicos.push(s);DB.seedV1=true;saveNow();if(!location.hash||location.hash==='#/')location.hash='#/s/'+s.id}
route();
if(SYNC.url)sincronizar(true);
</script>
